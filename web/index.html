<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血鸭 Xueya - 极简健康数据追踪</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="mainApp" class="app-container">
        <!-- Header Section -->
        <header>
            <div class="brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="white">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <h1>血鸭</h1>
            </div>
            <div class="header-actions">
                <div class="data-tools btn-group">
                    <button id="exportCsv" class="btn btn-secondary btn-sm" title="导出 CSV">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
                        CSV
                    </button>
                    <button id="exportXlsx" class="btn btn-secondary btn-sm" title="导出 Excel">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.17 3.25Q21.5 3.25 21.76 3.5 22.03 3.74 22.03 4.09V19.91Q22.03 20.26 21.76 20.5 21.5 20.75 21.17 20.75H7.58Q7.24 20.75 6.98 20.5 6.72 20.26 6.72 19.91V16.62H2.33Q1.99 16.62 1.73 16.36 1.47 16.11 1.47 15.77V8.23Q1.47 7.89 1.73 7.64 1.99 7.38 2.33 7.38H6.72V4.09Q6.72 3.74 6.98 3.5 7.24 3.25 7.58 3.25H21.17M19.03 18.75V15.54H17.84L16.27 18.75H14.86L17.06 14.54L14.93 10.5H16.37L17.84 13.52L19.34 10.5H20.71L18.61 14.53L20.75 18.75H19.03M12.91 18.75V17.5H10.16V15.54H12.16V14.29H10.16V12.04H12.91V10.79H8.72V18.75H12.91M19.03 9.5V5.25H8.72V7.38H11.44V8.63H8.72V9.5H19.03Z"/></svg>
                        Excel
                    </button>
                    <label class="btn btn-secondary btn-sm" title="导入 Excel">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                        导入
                        <input type="file" id="importXlsx" accept=".xlsx" style="display:none;">
                    </label>
                </div>
                <button id="settingsBtn" class="btn btn-secondary btn-icon" title="设置">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Dashboard Section -->
        <main class="dashboard">
            <div class="flex-between">
                <h2>健康仪表盘</h2>
                <div id="rangeLabel" style="font-size: 13px; color: var(--text-dim);"></div>
            </div>            <!-- Metrics Summary -->
            <section id="summary" class="metrics-grid">
                <!-- Summary cards will be injected by app.js -->
            </section>

            <!-- Charts Grid Section (Side by Side) -->
            <section class="charts-grid">
                <article class="glass-card chart-card">
                    <div class="chart-header">
                        <h3>血糖趋势 <small>mmol/L</small></h3>
                    </div>
                    <div id="glucoseChart" class="chart-container"></div>
                </article>
                <article class="glass-card chart-card">
                    <div class="chart-header">
                        <h3>收缩压趋势 <small>mmHg</small></h3>
                    </div>
                    <div id="pressureChart" class="chart-container"></div>
                </article>
            </section>

            <!-- Add Record Form Section (Full Width Below) -->
            <section class="record-form-section">
                <div class="glass-card">
                    <div class="section-title">
                        <h3>新增健康记录</h3>
                        <div id="message" class="status-msg"></div>
                    </div>
                    <form id="recordForm" class="record-form-horizontal">
                        <div class="form-row">
                            <div class="form-group">
                                <label>日期</label>
                                <input type="date" name="date" required>
                            </div>
                            <div class="form-group">
                                <label>时间</label>
                                <input type="time" name="time">
                            </div>
                            <div class="form-group">
                                <label>时段</label>
                                <select name="segment">
                                    <option value="早上">早上</option>
                                    <option value="中午">中午</option>
                                    <option value="下午">下午</option>
                                    <option value="晚上">晚上</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>血糖 (动态/扎手指)</label>
                                <div class="input-row">
                                    <input type="number" step="0.1" name="dynamicGlucose" placeholder="动态">
                                    <input type="number" step="0.1" name="fingerGlucose" placeholder="扎手">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>血压 (收缩/舒张)</label>
                                <div class="input-row">
                                    <input type="number" name="systolic" placeholder="收缩">
                                    <input type="number" name="diastolic" placeholder="舒张">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>脉搏</label>
                                <input type="number" name="pulse" placeholder="bpm">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea name="note" rows="1" placeholder="补充信息..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                                保存记录
                            </button>
                            <label class="btn btn-secondary camera-button">
                                <input type="file" id="cameraInput" accept="image/*" capture="camera">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12,12m-3.2,0a3.2,3.2 0,1 0,6.4 0a3.2,3.2 0,1 0,-6.4 0M9,2L7.17,4H4c-1.1,0-2,0.9-2,2v12c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V6c0-1.1-0.9-2-2-2h-3.17L15,2H9z"/></svg>
                                拍照识别
                            </label>
                        </div>
                    </form>
                </div>
            </section>

            <!-- History Section (Below Form) -->
            <section class="records-section">
                <div class="flex-between mb-4">
                    <h3>历史记录</h3>
                    <div class="filter-group">
                        <select id="monthSelect" class="btn btn-secondary btn-sm"></select>
                        <input type="date" id="dateSearch" class="btn btn-secondary btn-sm">
                    </div>
                </div>
                
                <div id="issues"></div>

                <div class="segment-tabs mb-4">
                    <button class="segment-btn active" data-segment="all">全部</button>
                    <button class="segment-btn" data-segment="早上">早上</button>
                    <button class="segment-btn" data-segment="中午">中午</button>
                    <button class="segment-btn" data-segment="下午">下午</button>
                    <button class="segment-btn" data-segment="晚上">晚上</button>
                </div>

                <div id="dayTable" class="history-list">
                    <!-- History will be injected by app.js -->
                </div>
            </section>
        </main>
    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="overlay">
        <div class="modal">
            <div class="login-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="white">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <h2 id="loginTitle">登录</h2>
                <p id="loginHint">请输入凭据以继续</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="密码" required>
                </div>
                <button type="submit" id="loginSubmit" class="btn btn-primary btn-block mt-4">确定</button>
                <div id="loginError" class="status-msg text-center mt-4" style="color:var(--accent)"></div>
            </form>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsOverlay" class="overlay">
        <div class="modal">
            <div class="flex-between mb-4">
                <h3>系统设置</h3>
                <button id="closeSettings" class="btn btn-secondary btn-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="settings-list">
                <div class="form-group">
                    <label>数据存储路径</label>
                    <input type="text" id="settingsDataPath" readonly>
                </div>
                <div class="form-group">
                    <label>Vision API URL</label>
                    <input type="text" id="settingsVisionURL">
                </div>
                <div class="form-group">
                    <label>新密码 (留空不修改)</label>
                    <input type="password" id="settingsNewPassword">
                </div>
                <button id="saveSettings" class="btn btn-primary btn-block mt-4">保存设置</button>
                <button id="logoutButton" class="btn btn-secondary btn-block mt-4" style="color:var(--accent)">退出登录</button>
                <div id="settingsMessage" class="status-msg text-center mt-4"></div>
                <div class="text-center mt-4" style="opacity: 0.5; font-size: 12px;">
                    <span id="buildVersion">v0.1.5</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="emptyTemplate">
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17l2-2 2 2 4-4-1.41-1.41L11 15.17l-1.59-1.59L8 15l1 2z"/></svg>
            <p>暂无记录，快去添加第一条吧</p>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
