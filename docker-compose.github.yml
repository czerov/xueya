services:
  xueya:
    image: ghcr.io/czerov/xueya:latest
    container_name: xueya
    network_mode: host
    environment:
      ADDR: ":6644"
      # 拍照识别（可选，不配则用演示数据）
      VISION_API_URL: https://api.siliconflow.cn/v1/chat/completions
      VISION_API_KEY: sk-你的key
      VISION_MODEL: Qwen/Qwen3.5-4B
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
